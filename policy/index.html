<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#edf2fb" />
  <title>签证政策库 - VisaWeb</title>
  <meta name="description" content="按国家查询中国大陆普通护照签证政策、停留规则、材料清单、常见风险、准备顺序和官方参考链接。" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="has-mobile-quickbar">
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="../index.html"><span class="brand-mark">V</span><span class="brand-name">VisaWeb</span></a>
      <nav class="nav"><a href="../index.html">首页</a></nav>
      <a class="btn btn-line" href="../index.html">返回首页</a>
    </div>
  </header>

  <main class="container policy-main block reveal show">
    <div class="block-head policy-page-head">
      <div>
        <p class="tag">中国大陆普通护照</p>
        <h2>签证政策库</h2>
      </div>
    </div>
    <div class="policy-tools card">
      <input id="policySearch" type="search" placeholder="搜索国家、签证类型或关键词" />
      <select id="policyRegion"><option value="全部">全部地区</option><option value="亚洲">亚洲</option><option value="欧洲">欧洲</option><option value="美洲">美洲</option><option value="大洋洲">大洋洲</option></select>
      <button id="policyReset" class="btn btn-ghost" type="button">重置</button>
    </div>
    <p id="policyMeta" class="policy-meta">先筛国家，再看规则、材料和风险，最后点开官方入口复核。</p>

    <section class="policy-detail-layout">
      <aside class="card policy-country-list" id="policyCountryList"></aside>
      <article class="card policy-detail-pane" id="policyDetailPane">
        <p class="tip-muted">请选择国家查看详情。</p>
      </article>
    </section>
  </main>

  <nav class="mobile-quickbar" aria-label="移动端快捷导航">
    <a href="../index.html">首页</a>
    <a href="#policySearch">搜索</a>
    <a href="#policyCountryList">列表</a>
    <a href="#policyDetailPane">详情</a>
  </nav>
  <script src="../data/visa-data.js"></script>
  <script src="../app.js"></script>
</body>
</html>
