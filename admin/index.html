<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>数据维护 - VisaWeb</title>
  <meta name="theme-color" content="#edf2fb" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="topbar"><div class="container topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark">V</span><span class="brand-name">VisaWeb Admin</span></a></div></header>
  <main class="container block reveal show">
    <div class="block-head"><h2>轻量数据维护</h2></div>
    <section class="card form-card">
      <p class="tip-muted">粘贴 JSON 数组后可保存到浏览器本地（localStorage），前台页面会优先读取本地数据。</p>
      <textarea id="adminJson" rows="20" placeholder="粘贴 VISA_DATA JSON"></textarea>
      <div class="compare-actions">
        <button id="adminLoad" class="btn btn-ghost" type="button">读取当前数据</button>
        <button id="adminValidate" class="btn btn-line" type="button">校验数据</button>
        <button id="adminSave" class="btn btn-solid" type="button">保存本地数据</button>
        <button id="adminClear" class="btn btn-line" type="button">清除本地覆盖</button>
      </div>
      <p id="adminMsg" class="tip-muted"></p>
      <ul id="adminValidation" class="admin-validation"></ul>
    </section>
  </main>
  <script src="../data/visa-data.js"></script>
  <script>
    const key = 'visa_data_override_v1';
    const text = document.getElementById('adminJson');
    const msg = document.getElementById('adminMsg');
    const validationList = document.getElementById('adminValidation');
    const requiredTextFields = [
      'country',
      'flagCode',
      'region',
      'entryRuleCN',
      'visaType',
      'stay',
      'processing',
      'fee',
      'updatedAt',
      'verifiedAt',
      'sourceUpdatedAt',
      'sourceNote',
      'validity',
      'interview',
      'leadTime',
      'officialStep'
    ];
    const requiredArrayFields = ['coreDocs', 'riskTips', 'communityIssues', 'officialRefs'];
    const validRegions = ['亚洲', '欧洲', '美洲', '大洋洲'];

    const escapeHtml = (value) => String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');

    const showValidation = (issues) => {
      validationList.innerHTML = issues.map((issue) => `<li class="${escapeHtml(issue.type)}">${escapeHtml(issue.text)}</li>`).join('');
    };

    const validateUrl = (url) => {
      try {
        const parsed = new URL(url);
        return parsed.protocol === 'http:' || parsed.protocol === 'https:';
      } catch (e) {
        return false;
      }
    };

    const validateVisaData = (records) => {
      const issues = [];
      const seen = new Set();
      if (!Array.isArray(records)) {
        return [{ type: 'error', text: '根节点必须是数组。' }];
      }

      records.forEach((item, index) => {
        const label = item && item.country ? item.country : `第 ${index + 1} 条`;
        if (!item || typeof item !== 'object' || Array.isArray(item)) {
          issues.push({ type: 'error', text: `${label}：必须是对象。` });
          return;
        }

        if (seen.has(item.country)) {
          issues.push({ type: 'error', text: `${label}：国家名重复。` });
        }
        if (item.country) seen.add(item.country);

        requiredTextFields.forEach((field) => {
          if (typeof item[field] !== 'string' || !item[field].trim()) {
            issues.push({ type: 'error', text: `${label}：缺少文本字段 ${field}。` });
          }
        });

        if (typeof item.visaRequiredCN !== 'boolean') {
          issues.push({ type: 'error', text: `${label}：visaRequiredCN 必须是 true 或 false。` });
        }
        if (typeof item.expedited !== 'boolean') {
          issues.push({ type: 'error', text: `${label}：expedited 必须是 true 或 false。` });
        }
        if (item.region && !validRegions.includes(item.region)) {
          issues.push({ type: 'warning', text: `${label}：region 不在当前筛选地区内。` });
        }

        requiredArrayFields.forEach((field) => {
          if (!Array.isArray(item[field]) || !item[field].length) {
            issues.push({ type: 'error', text: `${label}：${field} 必须是非空数组。` });
            return;
          }
          item[field].forEach((value, valueIndex) => {
            if (typeof value !== 'string' || !value.trim()) {
              issues.push({ type: 'error', text: `${label}：${field}[${valueIndex}] 必须是非空文本。` });
            }
          });
        });

        if (item.officialRefs?.some((url) => !validateUrl(url))) {
          issues.push({ type: 'error', text: `${label}：officialRefs 存在无效链接。` });
        }
        if (!Array.isArray(item.extraDocs)) {
          issues.push({ type: 'warning', text: `${label}：extraDocs 建议保持为数组，免签国家也可为空数组。` });
        }
      });

      if (!records.length) {
        issues.push({ type: 'error', text: '至少需要保留一个国家记录。' });
      }
      if (!issues.length) {
        issues.push({ type: 'ok', text: `校验通过，共 ${records.length} 条国家记录。` });
      }
      return issues;
    };

    const parseEditorData = () => {
      const parsed = JSON.parse(text.value);
      const issues = validateVisaData(parsed);
      showValidation(issues);
      const errors = issues.filter((issue) => issue.type === 'error');
      if (errors.length) throw new Error(`发现 ${errors.length} 个数据错误，请先修正。`);
      return { parsed, issues };
    };

    document.getElementById('adminLoad').onclick = () => {
      try {
        const local = localStorage.getItem(key);
        text.value = local || JSON.stringify(window.VISA_DATA || [], null, 2);
        msg.textContent = '已加载当前数据。';
        showValidation(validateVisaData(JSON.parse(text.value)));
      } catch (e) {
        msg.textContent = '读取失败：' + e.message;
      }
    };
    document.getElementById('adminValidate').onclick = () => {
      try {
        const { issues } = parseEditorData();
        const warningCount = issues.filter((issue) => issue.type === 'warning').length;
        msg.textContent = warningCount ? `校验完成，有 ${warningCount} 个提醒。` : '校验通过，可以保存。';
      } catch (e) {
        msg.textContent = '校验失败：' + e.message;
      }
    };
    document.getElementById('adminSave').onclick = () => {
      try {
        const { parsed, issues } = parseEditorData();
        localStorage.setItem(key, JSON.stringify(parsed));
        const warningCount = issues.filter((issue) => issue.type === 'warning').length;
        msg.textContent = warningCount
          ? `保存成功，但还有 ${warningCount} 个提醒；刷新前台页面即可生效。`
          : '保存成功，刷新前台页面即可生效。';
      } catch (e) {
        msg.textContent = '保存失败：' + e.message;
      }
    };
    document.getElementById('adminClear').onclick = () => {
      try {
        localStorage.removeItem(key);
        msg.textContent = '已清除本地覆盖数据。';
        showValidation([]);
      } catch (e) {
        msg.textContent = '清除失败：' + e.message;
      }
    };
  </script>
</body>
</html>
