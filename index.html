<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e2a47" />
  <title>VisaWeb 签证服务</title>
  <meta name="description" content="VisaWeb 提供热门国家签证政策、材料清单、风险提示与自动评估，界面简洁，体验流畅。" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-orb orb-a" aria-hidden="true"></div>
  <div class="bg-orb orb-b" aria-hidden="true"></div>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="./index.html" aria-label="VisaWeb 首页"><span class="brand-mark">V</span><span class="brand-name">VisaWeb</span></a>
      <nav class="nav">
        <a href="./policy/index.html">签证政策</a>
      </nav>
      <div class="top-actions">
        <a class="btn btn-line" href="./policy/index.html">查看政策</a>
      </div>
    </div>
  </header>
  <main id="home">
    <section class="hero container reveal show">
      <p class="tag">签证信息平台</p>
      <h1>签证办理更清晰，出行准备更省心</h1>
      <p class="hero-sub">聚合热门国家签证类型、材料要求和办理建议，一页完成信息筛选。</p>
      <div class="hero-actions">
        <a class="btn btn-solid" href="./policy/index.html">查看签证政策</a>
      </div>
    </section>

    <section class="container block reveal">
      <div class="quick-links card">
        <a href="#autoEval">自动评估</a>
        <a href="#compareSection">国家对比</a>
        <a href="#countdownSection">时间倒推</a>
        <a href="#faqSection">常见问题</a>
      </div>
    </section>

    <section id="hotSection" class="container block reveal">
      <div class="block-head"><h2>热门国家签证</h2><a href="./policy/index.html">查看更多</a></div>
      <div id="homeCards" class="card-grid"></div>
    </section>

    <section id="autoEval" class="container block reveal">
      <div class="block-head"><h2>签证自动评估</h2></div>
      <div class="apply-grid">
        <form id="visaEvalForm" class="card form-card" action="#" method="post">
          <label>目标国家<select id="evalCountry" required><option value="">请选择国家</option></select></label>
          <label>出行目的<select id="evalPurpose" required><option value="tourism">旅游</option><option value="business">商务</option><option value="visit">探亲访友</option></select></label>
          <label>预计停留天数<select id="evalStayDays" required><option value="short" selected>7 天内</option><option value="mid">8-15 天</option><option value="long">16 天以上</option></select></label>
          <label>月收入（人民币）<select id="evalIncome" required><option value="low">5000 以下</option><option value="mid" selected>5000 - 20000</option><option value="high">20000 以上</option></select></label>
          <label>过往出境记录<select id="evalTravel" required><option value="none">无</option><option value="some" selected>1-3 次</option><option value="many">4 次及以上</option></select></label>
          <label>是否有拒签史<select id="evalRefusal" required><option value="no" selected>无拒签史</option><option value="yes">有拒签史</option></select></label>
          <label>资金余额覆盖行程<select id="evalFund" required><option value="weak">不足 1 倍</option><option value="normal" selected>1-2 倍</option><option value="strong">2 倍以上</option></select></label>
          <label>行程真实性<select id="evalPlan" required><option value="basic">基础</option><option value="clear" selected>清晰</option><option value="strong">完整可核验</option></select></label>
          <label>材料翻译/公证准备<select id="evalDocLegal" required><option value="no">未准备</option><option value="part" selected>部分准备</option><option value="yes">准备完整</option></select></label>
          <label>材料完整度<input id="evalDocs" type="range" min="40" max="100" step="5" value="80" /></label>
          <label><input id="evalJob" type="checkbox" checked /> 有稳定工作/在读证明</label>
          <button class="btn btn-solid" type="submit">开始评估</button>
        </form>
        <aside class="card tip-card">
          <h3>评估结果</h3>
          <p id="evalRate">通过率：--</p>
          <p id="evalLevel">风险等级：--</p>
          <p id="evalAdvice" class="tip-muted">填写信息后可生成建议。</p>
          <ul id="evalBreakdown" class="risk-list"><li>将显示分项评分。</li></ul>
        </aside>
      </div>
    </section>

    <section id="compareSection" class="container block reveal">
      <div class="block-head"><h2>国家对比</h2></div>
      <div class="compare-wrap card">
        <div class="compare-actions">
          <select id="compareA"></select>
          <select id="compareB"></select>
          <select id="compareC"></select>
          <button id="compareBtn" class="btn btn-solid" type="button">开始对比</button>
        </div>
        <div id="compareTable" class="compare-table"></div>
      </div>
    </section>

    <section id="countdownSection" class="container block reveal">
      <div class="block-head"><h2>办理时间倒推器</h2></div>
      <div class="card countdown-box">
        <div class="compare-actions">
          <select id="countCountry"></select>
          <input id="departDate" type="date" />
          <button id="countBtn" class="btn btn-solid" type="button">计算时间</button>
        </div>
        <p id="countResult" class="tip-muted">输入国家和出发日期后自动计算最晚提交时间。</p>
      </div>
    </section>

    <section id="faqSection" class="container block reveal">
      <div class="block-head"><h2>常见问题</h2></div>
      <div class="card">
        <div class="compare-actions"><select id="faqCountry"></select></div>
        <div id="smartFaq" class="faq"></div>
      </div>
    </section>

  </main>
  <footer class="container footer reveal"><p>© 2026 VisaWeb · 签证信息服务平台</p></footer>
  <script src="./app.js"></script>
  <script src="./data/visa-data.js"></script>
  <script src="./data/site-data-bindings.js"></script>
</body>
</html>
